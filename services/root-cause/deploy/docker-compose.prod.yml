# Root Cause production stack, run from /opt/rootcause on the host behind its
# shared Traefik (external network `traefik`, resolver `letsencrypt`).
#
# The image comes from GHCR, pinned by the tag in .env next to this file
# (written by CI on every deploy):
#   WEB_TAG=<sha>
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
name: rootcause

services:
  web:
    image: ghcr.io/sunkek/rootcause-web:${WEB_TAG:-latest}
    container_name: rootcause_web
    restart: unless-stopped
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.rootcause.rule: Host(`rootcause.suncake.xyz`)
      traefik.http.routers.rootcause.entrypoints: websecure
      traefik.http.routers.rootcause.tls.certresolver: letsencrypt
      traefik.http.services.rootcause.loadbalancer.server.port: "80"

networks:
  traefik:
    external: true
