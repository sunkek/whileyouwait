# Flaky production stack, run from /opt/flaky on the host behind its
# shared Traefik (external network `traefik`, resolver `letsencrypt`).
#
# The image comes from GHCR, pinned by the tag in .env next to this file
# (written by CI on every deploy):
#   WEB_TAG=<sha>
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
name: flaky

services:
  web:
    image: ghcr.io/sunkek/flaky-web:${WEB_TAG:-latest}
    container_name: flaky_web
    restart: unless-stopped
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.flaky.rule: Host(`flaky.suncake.xyz`)
      traefik.http.routers.flaky.entrypoints: websecure
      traefik.http.routers.flaky.tls.certresolver: letsencrypt
      traefik.http.services.flaky.loadbalancer.server.port: "80"

networks:
  traefik:
    external: true
