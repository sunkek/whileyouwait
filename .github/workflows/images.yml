name: build-images

# Build the web image (nginx serving the catalog and every game) and push it to
# GHCR as ghcr.io/<owner>/whileyouwait-web, then roll it out on the host.
# Only what goes into the image triggers a build: docs, check scripts and CI
# changes don't redeploy the site. Tags and a manual run always build, and puzzles.yml
# dispatches this workflow after extending the dailies, because its push can't
# start other workflows.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "services/**"
      - "!services/**/*.md"
      - "!services/*/scripts/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services
          file: services/web/.docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/whileyouwait-web:latest
            ghcr.io/${{ steps.owner.outputs.name }}/whileyouwait-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Continuous deploy. The host side is /opt/ci-deploy.sh, which the deploy key
  # is forced to run: it only accepts NAME_TAG=<sha> pairs, writes them into
  # /opt/whileyouwait/.env, then pulls and runs `up -d --wait`. Requires repo
  # secrets DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS; without
  # DEPLOY_SSH_KEY the job no-ops.
  deploy:
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-whileyouwait # never overlap two rollouts
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Roll out the new image
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY secret not set — skipping deploy."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "deploy@$DEPLOY_HOST" "WEB_TAG=$GITHUB_SHA"
      # Tells Bing, Yandex and the other IndexNow engines the pages changed. The
      # key file sits at the site root; it's meant to be public. A failure here
      # doesn't fail the deploy. Google isn't part of IndexNow: it reads the sitemap.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Notify search engines
        continue-on-error: true
        run: |
          key="$(basename -s .txt services/web/public/*.txt | grep -E '^[0-9a-f]{32}$')"
          urls="$(grep -o 'https://[^<]*' services/web/public/sitemap.xml | grep -v sitemaps.org | jq -R . | jq -sc .)"
          curl -sS -m 30 -o /dev/null -w 'IndexNow: %{http_code}\n' -H 'content-type: application/json; charset=utf-8' \
            -d "{\"host\":\"whileyouwait.suncake.xyz\",\"key\":\"$key\",\"urlList\":$urls}" \
            https://api.indexnow.org/indexnow
