name: build-images

# Build the web image (nginx serving the catalog and every game) and push it to
# GHCR as ghcr.io/<owner>/whileyouwait-web, then roll it out on the host.
# Only what goes into the image triggers a build: docs, check scripts and CI
# changes don't redeploy the site. Tags and a manual run always build, and puzzles.yml
# dispatches this workflow after extending the dailies, because its push can't
# start other workflows.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "services/**"
      - "!services/**/*.md"
      - "!services/*/scripts/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: services
          file: services/web/.docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/whileyouwait-web:latest
            ghcr.io/${{ steps.owner.outputs.name }}/whileyouwait-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Continuous deploy. The host side is /opt/ci-deploy.sh, which the deploy key
  # is forced to run: it only accepts NAME_TAG=<sha> pairs, writes them into
  # /opt/whileyouwait/.env, then pulls and runs `up -d --wait`. Requires repo
  # secrets DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS; without
  # DEPLOY_SSH_KEY the job no-ops.
  deploy:
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-whileyouwait # never overlap two rollouts
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Roll out the new image
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY secret not set — skipping deploy."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "deploy@$DEPLOY_HOST" "WEB_TAG=$GITHUB_SHA"
