# WhileYouWait production stack, run from /opt/whileyouwait on the host behind
# its shared Traefik (external network `traefik`, resolver `letsencrypt`).
#
# .env next to this file (mode 600) holds the secrets, the Umami website ID and
# the web image tag (the tag is rewritten by CI on every deploy):
#   POSTGRES_PASSWORD=...  UMAMI_APP_SECRET=...  UMAMI_WEBSITE_ID=<uuid>
#   WEB_TAG=<sha>
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --wait
name: whileyouwait

services:
  postgres:
    image: postgres:18-alpine
    container_name: whileyouwait_postgres
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "umami", "-d", "umami"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Migrates its own schema on start. The dashboard is not routed through
  # Traefik: it listens on the host's loopback only, reached over an SSH tunnel
  # (deploy/README.md). Only the tracker and the collect endpoint are public,
  # proxied by web.
  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    container_name: whileyouwait_umami
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD:?}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?}
      TRACKER_SCRIPT_NAME: s.js
      DISABLE_TELEMETRY: "1"
      # Cloudflare sits in front; without this every visitor is a Cloudflare IP.
      CLIENT_IP_HEADER: cf-connecting-ip
    ports:
      - "127.0.0.1:3901:3000"

  # The only service on the shared `traefik` network. It reaches umami over
  # this project's own default network.
  web:
    image: ghcr.io/sunkek/whileyouwait-web:${WEB_TAG:-latest}
    container_name: whileyouwait_web
    restart: unless-stopped
    mem_limit: 64m
    pids_limit: 128
    environment:
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.whileyouwait.rule: Host(`whileyouwait.suncake.xyz`)
      traefik.http.routers.whileyouwait.entrypoints: websecure
      traefik.http.routers.whileyouwait.tls.certresolver: letsencrypt
      traefik.http.services.whileyouwait.loadbalancer.server.port: "80"
      # Security headers on every response, nginx error pages included.
      # CSP: every resource from this origin, except Google Fonts. Inline
      # scripts stay allowed: each game's rules live in its page's inline
      # script, which the checks under services/<game>/scripts read, and the
      # site has no accounts or tokens for an injection to steal. The policy
      # still stops injected code from loading script from elsewhere, and from
      # sending data off-site by fetch, beacon or image (not by navigating
      # away). Checked page by page in headless Chrome.
      traefik.http.routers.whileyouwait.middlewares: whileyouwait-headers
      traefik.http.middlewares.whileyouwait-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.whileyouwait-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.whileyouwait-headers.headers.frameDeny: "true"
      traefik.http.middlewares.whileyouwait-headers.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.whileyouwait-headers.headers.permissionsPolicy: "camera=(), microphone=(), geolocation=()"
      traefik.http.middlewares.whileyouwait-headers.headers.contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

volumes:
  postgres-data:

networks:
  traefik:
    external: true
