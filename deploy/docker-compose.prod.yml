# Hexroute production stack, run from /opt/hexroute on the host behind its
# shared Traefik (external network `traefik`, resolver `letsencrypt`).
#
# The image comes from GHCR, pinned by the tag in .env next to this file
# (written by CI on every deploy):
#   WEB_TAG=<sha>
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
name: hexroute

services:
  web:
    image: ghcr.io/sunkek/hexroute-web:${WEB_TAG:-latest}
    container_name: hexroute_web
    restart: unless-stopped
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.hexroute.rule: Host(`hexroute.suncake.xyz`)
      traefik.http.routers.hexroute.entrypoints: websecure
      traefik.http.routers.hexroute.tls.certresolver: letsencrypt
      traefik.http.services.hexroute.loadbalancer.server.port: "80"

networks:
  traefik:
    external: true
